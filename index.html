<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black" />
<title>Magic Camera</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- PANTALLA 1: inicio -->
  <section id="start-screen" class="screen">
    <h1 class="wordmark">MAGIC<br />CAMERA</h1>
    <button id="start-btn" class="btn-primary">START CAMERA</button>
    <p id="status" class="status" aria-live="polite"></p>
  </section>

  <!-- PANTALLA 2: cámara -->
  <section id="camera-screen" class="screen hidden">
    <video id="video" playsinline autoplay muted></video>

    <!-- overlay donde se dibujan esquinas / bounding box / (fases futuras: tracking, carta digital) -->
    <canvas id="overlay"></canvas>

    <div id="hud" class="hud">
      <span id="fps">-- fps</span>
      <span id="detector-status">Cargando visión por computador…</span>
    </div>

    <button id="back-btn" class="btn-ghost" aria-label="Volver">✕</button>
    <button id="debug-toggle-btn" class="btn-ghost btn-debug" aria-label="Debug">DBG</button>

    <div id="debug-panel" class="debug-panel hidden">
      <label><input type="checkbox" id="dbg-corners" checked /> Mostrar esquinas</label>
      <label><input type="checkbox" id="dbg-bbox" checked /> Mostrar bounding box</label>
      <label><input type="checkbox" id="dbg-fps" checked /> Mostrar FPS</label>
      <label><input type="checkbox" id="dbg-tracking" /> Mostrar tracking points</label>
      <label><input type="checkbox" id="dbg-digital" /> Mostrar carta digital</label>
    </div>
  </section>

  <script src="camera.js"></script>
  <script src="cardDetector.js"></script>
  <script src="cardTracker.js"></script>
  <script src="perspective.js"></script>
  <script src="app.js"></script>
  <script>
    function onOpenCvLoad() {
      CardDetector.onScriptLoaded();
    }
  </script>
  <script async src="https://docs.opencv.org/4.x/opencv.js" onload="onOpenCvLoad()"></script>

</body>
</html>
